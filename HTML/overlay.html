<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--
      Background-tab pause fix — MUST be the first script in <head>.
      A background tab reports document.visibilityState === "hidden". The
      cross-origin YouTube iframe reads the TOP document's visibility and pauses
      its media when hidden, which is what stopped playback when this page wasn't
      the active tab. We can't touch the cross-origin iframe's audio, so we pin
      the page to always *report* itself visible. This runs before the YouTube
      iframe_api script so YouTube's own visibility listener only ever sees
      "visible". overlay.js re-asserts this defensively and also suppresses the
      visibilitychange event. The real OS tab state is unchanged; only the
      JS-observable signal is overridden.
    -->
    <script>
        (function () {
            try {
                Object.defineProperty(document, 'visibilityState', {
                    configurable: true, get: function () { return 'visible'; }
                });
                Object.defineProperty(document, 'hidden', {
                    configurable: true, get: function () { return false; }
                });
                document.addEventListener('visibilitychange', function (e) {
                    e.stopImmediatePropagation();
                }, true);
                window.addEventListener('visibilitychange', function (e) {
                    e.stopImmediatePropagation();
                }, true);
            } catch (err) { /* non-fatal */ }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediashare Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        #player-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        /* YouTube div / iframe fills the entire container */
        #yt-player {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* The YouTube IFrame API injects an <iframe> in here — force it to fill. */
        #yt-player iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        /* Spotify embed */
        #spotify-player {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            border: none;
        }

        /* Media controls bar — overlays on top of the video, doesn't shrink it */
        #player-controls {
            display: none;
            flex-direction: column;
            gap: 5px;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 12px 10px;
            background: rgba(0, 0, 0, 0.72);
            z-index: 20;
        }

        .ctrl-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #seek-bar {
            flex: 1;
            cursor: pointer;
            accent-color: #e05;
        }

        #seek-bar:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        #volume-bar {
            width: 90px;
            cursor: pointer;
            accent-color: #e05;
        }

        .volume-value {
            display: flex;
            align-items: center;
            gap: 3px;
            color: #fff;
            font: 0.8rem 'Segoe UI', sans-serif;
        }

        #volume-percent {
            width: 65px;
            padding: 3px 5px;
            border: 1px solid #666;
            border-radius: 4px;
            background: #222;
            color: #fff;
            font: inherit;
        }

        #time-display {
            color: #fff;
            font-size: 0.72rem;
            white-space: nowrap;
            font-family: 'Segoe UI', sans-serif;
            min-width: 90px;
            text-align: right;
        }

        .ctrl-icon {
            font-size: 0.9rem;
            line-height: 1;
        }

        #idle-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #555;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.2rem;
        }

        #playback-status {
            position: absolute;
            top: 12px; left: 12px; right: 12px;
            z-index: 30;
            padding: 10px 12px;
            border: 1px solid #666;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.88);
            color: #fff;
            font: 0.85rem 'Segoe UI', sans-serif;
        }
        #playback-status[hidden] { display: none; }
        #playback-status button { margin: 8px 6px 0 0; padding: 5px 10px; cursor: pointer; }
        #pause-resume-btn {
            padding: 5px 9px;
            border: 1px solid #666;
            border-radius: 4px;
            background: #222;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="idle-screen">Waiting for media…</div>
        <!-- YouTube player target -->
        <div id="yt-player" style="display:none"><div id="yt-player-mount"></div></div>
        <!-- Spotify embed target -->
        <iframe id="spotify-player"
                style="display:none"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"
                height="152">
        </iframe>

        <div id="playback-status" role="status" aria-live="polite" hidden>
            <div id="playback-message"></div>
            <button id="playback-retry-btn" type="button">Play / Retry</button>
            <button id="playback-skip-btn" type="button">Skip this song</button>
        </div>

        <!-- Media controls (shown when ?controls=1) -->
        <div id="player-controls">
            <div class="ctrl-row">
                <input type="range" id="seek-bar" aria-label="Playback progress" min="0" max="100" value="0" step="0.1">
                <span id="time-display">0:00 / 0:00</span>
            </div>
            <div class="ctrl-row">
                <button id="pause-resume-btn" type="button" aria-pressed="false">⏸ Pause</button>
                <span class="ctrl-icon">&#128266;</span>
                <input type="range" id="volume-bar" min="0" max="100" value="100" step="0.1" aria-label="Volume">
                <label class="volume-value">
                    <input type="number" id="volume-percent" min="0" max="100" value="100" step="0.1" inputmode="decimal" aria-label="Volume percentage">
                    <span>%</span>
                </label>
            </div>
        </div>
    </div>

    <!-- Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="../scrs/frontend/overlay.js?v=saved-playlists-1"></script>
</body>
</html>
